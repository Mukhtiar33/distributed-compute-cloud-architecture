name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-worker-agent:
    name: Build Worker Agent Binary
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build
        run: go build -o worker-agent ./cmd/worker-agent
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker-agent
          path: worker-agent/worker-agent

  build-control-plane:
    name: Build Control Plane
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build
        run: go build -o control-plane ./cmd/control-plane
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: control-plane
          path: control-plane/control-plane
