name: Security Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "control-plane/**"
      - "worker-agent/**"
      - "proto/**"
  push:
    branches: [main]
    paths:
      - "control-plane/**"
      - "worker-agent/**"
      - "proto/**"

jobs:
  isolation-tests:
    name: Isolation Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Run isolation tests
        run: |
          cd control-plane
          go test ./internal/sandbox/... -v -run "TestSandboxManager_NetworkDeny|TestSandboxManager_FilesystemIsolation|TestSandboxManager_ExecuteEcho"
      - name: Run scanner security tests
        run: |
          cd control-plane
          go test ./internal/scanner/... -v

  hash-tampering-tests:
    name: Hash Tampering Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Run hash verification tests
        run: |
          cd control-plane
          go test ./internal/auth/... -v -run "TestCA_SignCSR|TestTokenManager"

  idempotency-tests:
    name: Idempotency Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Run idempotency tests
        run: |
          cd control-plane
          go test ./internal/api/... -v -run "TestSubmitJob"
