name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  control-plane:
    name: Control Plane (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Lint
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./... -v

  worker-agent:
    name: Worker Agent (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Lint
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./... -v

  website:
    name: Website (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
